  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      // Service Worker Registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('✅ Service Worker registered:', registration.scope);
            })
            .catch(error => {
              console.error('❌ Service Worker registration failed:', error);
            });
        });
      }

      // iOS PWA Installation Prompt
      window.addEventListener('load', () => {
        // Detect iOS
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isInStandaloneMode = ('standalone' in window.navigator) && window.navigator.standalone;
        
        // Check if running as installed PWA
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || isInStandaloneMode;
        
        if (isIOS && !isStandalone) {
          // Show iOS installation instructions after 5 seconds
          setTimeout(() => {
            console.log('📱 iOS detected - PWA can be installed!');
            console.log('To install: Tap Share button → Add to Home Screen');
            
            // Optional: Show a custom banner or toast
            // You can implement a custom UI prompt here
          }, 5000);
        }
        
        // For Android/Desktop - use beforeinstallprompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
          // Prevent the mini-infobar from appearing on mobile
          e.preventDefault();
          deferredPrompt = e;
          
          console.log('📱 PWA installable - you can add an install button');
          // Optional: Show your custom install button here
          
          // Example: Auto-prompt after 10 seconds (uncomment if desired)
          // setTimeout(() => {
          //   if (deferredPrompt) {
          //     deferredPrompt.prompt();
          //     deferredPrompt.userChoice.then((choiceResult) => {
          //       console.log(choiceResult.outcome === 'accepted' ? '✅ PWA installed' : '❌ PWA install dismissed');
          //       deferredPrompt = null;
          //     });
          //   }
          // }, 10000);
        });
        
        // Detect successful installation
        window.addEventListener('appinstalled', () => {
          console.log('🎉 PWA installed successfully!');
          deferredPrompt = null;
        });
        
        // Log if already running as PWA
        if (isStandalone) {
          console.log('✅ Running as installed PWA!');
        }
      });
    </script>
